; ============================================================================
;  SECURITAS - Firmware do rastreador veicular (ESP32 DevKit V1)
;  Plataforma: PlatformIO + Arduino framework
;
;  Uso:
;    pio run              -> compila
;    pio run -t upload    -> grava no ESP32
;    pio device monitor -b 115200   -> acompanha os logs
;
;  Antes de gravar, preencha src/secrets.h (Wi-Fi, 4G e credenciais do
;  dispositivo). Veja ../LIGACOES_DE_PORTA.txt para a fiacao completa.
; ============================================================================

[env:esp32dev]
; Platform 6.x = Arduino core 2.0.17. O core 3.x (platform 8.x) trocou o
; HTTPClient::begin(Client*) por begin(NetworkClient&) e com isso deixou de
; aceitar o TinyGsmClient do TinyGSM — por isso o platform fica fixado aqui.
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bibliotecas de terceiros.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    mikalhart/TinyGPSPlus @ ^1.0.3
    vshymanskyy/TinyGSM @ ^0.12.0

; Opcoes de compilacao do ESP32.
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_BROWNOUT_DETECTOR=0

; Filtro do monitor serial (esconde o ruido de boot do ESP32).
monitor_filters =
    time
    esp32_exception_decoder
